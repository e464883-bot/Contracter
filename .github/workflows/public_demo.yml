name: Contracter - Demo pública

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contracter-public-demo
  cancel-in-progress: false

jobs:
  package_demo:
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Crear solo la página de la muestra
        run: node scripts/build_teacher_demo.mjs --output "$RUNNER_TEMP/contracter-demo/index.html"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/contracter-demo

  deploy_demo:
    needs: package_demo
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar la demostración estática
        id: deployment
        uses: actions/deploy-pages@v4
